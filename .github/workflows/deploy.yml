name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

env:
  HOST: 193.203.162.32
  REMOTE_USER: root
  IMAGE_NAME: helloworlds-portfolio
  NAMESPACE: portfolio
  DEPLOYMENT: portfolio-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Lifts the GitHub API rate limit when scripts/fetch-repos.mjs runs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "tag=v$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        # Runner is x86_64, same as the VPS — no cross-arch step needed.
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Strip any CR characters (common copy-paste corruption from Windows clipboards)
          # and ensure a trailing newline — OpenSSH refuses to load keys without one.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fail fast with a useful error if the key isn't parseable.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Ship image into k3s containerd
        # Pipe save → gzip → ssh → gunzip → ctr import; no temp files on the server.
        run: |
          docker save "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" "$IMAGE_NAME:latest" \
            | gzip \
            | ssh "$REMOTE_USER@$HOST" "gunzip | k3s ctr images import -"

      - name: Apply manifests
        run: |
          sed "s/__TAG__/${{ steps.tag.outputs.tag }}/g" deploy/k8s.yaml \
            | ssh "$REMOTE_USER@$HOST" "kubectl apply -f -"

      - name: Wait for rollout
        run: |
          ssh "$REMOTE_USER@$HOST" \
            "kubectl -n $NAMESPACE rollout status deploy/$DEPLOYMENT --timeout=180s"
