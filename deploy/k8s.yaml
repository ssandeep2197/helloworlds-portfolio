apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-web
  namespace: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-web
  template:
    metadata:
      labels:
        app: portfolio-web
    spec:
      containers:
        - name: web
          image: helloworlds-portfolio:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-web
  namespace: portfolio
spec:
  type: ClusterIP
  selector:
    app: portfolio-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - helloworlds.co.in
        - www.helloworlds.co.in
      secretName: portfolio-tls
  rules:
    - host: helloworlds.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-web
                port:
                  number: 80
    - host: www.helloworlds.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-web
                port:
                  number: 80
---
# Redirects portfolio.helloworlds.co.in → helloworlds.co.in (301).
# Separate ingress because nginx.ingress redirect annotations apply
# to the whole ingress, and we don't want to redirect the apex/www hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-redirect-ingress
  namespace: portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/permanent-redirect: https://helloworlds.co.in$request_uri
    nginx.ingress.kubernetes.io/permanent-redirect-code: "301"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portfolio.helloworlds.co.in
      secretName: portfolio-redirect-tls
  rules:
    - host: portfolio.helloworlds.co.in
      http:
        paths:
          # Backend is required by the Ingress schema but never reached —
          # the permanent-redirect annotation fires before routing to it.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-web
                port:
                  number: 80
